<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <aside class="side-panel" aria-label="Search and guestbook">
    <section class="search-block">
      <label class="search-field" for="search-input">
        <span class="search-label">Search</span>
        <input
          id="search-input"
          type="search"
          placeholder="Search cards..."
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <div class="category-filters" id="category-filters" role="group" aria-label="Categories"></div>
    </section>

    <section class="guestbook" aria-label="Guestbook">
      <h2 class="guestbook-title">留言板</h2>
      <form class="guestbook-form" id="guestbook-form">
        <label class="search-field" for="guest-name">
          <span class="search-label">Name</span>
          <input id="guest-name" name="name" type="text" maxlength="24" placeholder="Your name" required />
        </label>
        <label class="search-field" for="favorite-card">
          <span class="search-label">最喜歡的卡片</span>
          <select id="favorite-card" name="favorite" required></select>
        </label>
        <label class="search-field" for="guest-message">
          <span class="search-label">Message</span>
          <textarea
            id="guest-message"
            name="message"
            rows="3"
            maxlength="160"
            placeholder="Leave a short note..."
            required
          ></textarea>
        </label>
        <button class="guestbook-submit" type="submit">送出留言</button>
      </form>
      <div class="favorite-tally" id="favorite-tally" aria-live="polite"></div>
      <ul class="guestbook-list" id="guestbook-list"></ul>
    </section>
  </aside>

  <main class="stage">
    <header class="brand">
      <h1>Magic Card</h1>
      <p>點擊卡片，放大觀看</p>
    </header>

    <div class="gallery-wrap" id="gallery-wrap"></div>
  </main>

  <footer class="site-footer">
    <img
      class="support-qr"
      src="assets/paypal-qr.png"
      alt="PayPal support QR code"
      width="112"
      height="112"
    />
    <p class="support-note">
      Attached to every draft and finished piece I make: If you like my work, please consider showing a little support. It keeps me believing that genuine creativity still matters in the age of AI. Created by 火一山軍(AI)
    </p>
  </footer>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/Flip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
